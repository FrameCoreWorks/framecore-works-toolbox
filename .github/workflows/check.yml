name: Check catalog and portable package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/check_marketplace.py
      - run: python3 scripts/package_plugins.py --check
      - run: python3 scripts/package_plugins.py --output-dir "$RUNNER_TEMP/toolbox-dist"
