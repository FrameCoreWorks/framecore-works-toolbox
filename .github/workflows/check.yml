name: Check catalog and portable package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: python3 -m unittest discover -s tests
      - run: python3 -m unittest discover -s plugins/earshot-audio/tests -p '*_test.py'
      - run: python3 scripts/check_marketplace.py
      - run: python3 scripts/package_plugins.py --check
      - run: python3 scripts/package_plugins.py --plugin earshot-audio --check
      - run: python3 scripts/package_plugins.py --output-dir "$RUNNER_TEMP/toolbox-dist"
      - run: python3 scripts/package_plugins.py --plugin earshot-audio --output-dir "$RUNNER_TEMP/toolbox-dist"
